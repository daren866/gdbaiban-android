name: ci

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job-common:
    runs-on: ubuntu-24.04
    outputs:
      SHORT_SHA: ${{ steps.expose_sha.outputs.short_sha }}
    steps:
      - name: expose short commit sha
        id: expose_sha
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

  build-android:
    needs: job-common
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHORT_SHA: ${{ needs.job-common.outputs.SHORT_SHA }}
      NEW_PACKAGE_NAME: "com.gudaoweb.app"  # 定义新的包名
      APP_NAME: "GudaoWeb"  # 定义应用名称
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: cache gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('/*.gradle*', '/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: cache gradle wrapper
        uses: actions/cache@v3
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      # 使用 sed 临时修改包名
      - name: modify package name with sed
        run: |
          echo "原包名配置："
          grep -n "namespace\|applicationId" app/build.gradle.kts || echo "未找到配置"
          
          # 备份原文件
          cp app/build.gradle.kts app/build.gradle.kts.bak
          
          # 修改 namespace
          sed -i 's/namespace\s*=\s*"[^"]*"/namespace = "'"$NEW_PACKAGE_NAME"'"/' app/build.gradle.kts
          
          # 修改 applicationId
          sed -i 's/applicationId\s*=\s*"[^"]*"/applicationId = "'"$NEW_PACKAGE_NAME"'"/' app/build.gradle.kts
          
          # 修改 archivesName（输出文件名）
          sed -i 's/archivesName\.set\s*(\s*"[^"]*"/archivesName.set("'"$APP_NAME"'-v${android.defaultConfig.versionName}(${android.defaultConfig.versionCode})"/' app/build.gradle.kts
          
          echo "修改后的包名配置："
          grep -n "namespace\|applicationId" app/build.gradle.kts

      # 或者使用更复杂的 sed 命令处理多行情况
      - name: alternative sed method for complex cases
        if: always()  # 即使上面的步骤失败也执行
        run: |
          # 更精确的替换方法，处理可能的多行情况
          perl -i -pe 's/namespace\s*=\s*["'\''][^"'\'']*["'\'']/namespace = "'"$NEW_PACKAGE_NAME"'"/' app/build.gradle.kts
          perl -i -pe 's/applicationId\s*=\s*["'\''][^"'\'']*["'\'']/applicationId = "'"$NEW_PACKAGE_NAME"'"/' app/build.gradle.kts
          
          echo "使用 Perl 确认修改："
          grep -n "namespace\|applicationId" app/build.gradle.kts

      - name: clean outputs directory
        run: rm -rf app/build/outputs/*

      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: assemble debug artifact
        run: ./gradlew assembleDebug

      - name: upload artifacts to outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.SHORT_SHA }}
          path: |
            app/build/outputs/apk

      - name: expose version
        id: version
        run: ./gradlew -q printVersion | tee -a $GITHUB_ENV | tee -a $GITHUB_OUTPUT

      - name: expose apk path
        run: |
          echo "APK_PATH=$(find app/build/outputs/apk -name '*.apk' -type f -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2)" >> $GITHUB_ENV

      # 显示修改后的包名信息
      - name: show package info
        run: |
          echo "当前包名: $NEW_PACKAGE_NAME"
          echo "APK文件: $APK_PATH"
          echo "应用版本: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})"

      - name: create pre-release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.APP_NAME }} Pre-release ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }}) - ${{ env.SHORT_SHA }}
          tag_name: pre-${{ env.SHORT_SHA }}
          prerelease: true
          files: ${{ env.APK_PATH }}
          body: |
            ## ${{ env.APP_NAME }} 预发布版本
            
            - **应用名称:** ${{ env.APP_NAME }}
            - **包名:** ${{ env.NEW_PACKAGE_NAME }}
            - **版本名称:** ${{ env.VERSION_NAME }}
            - **版本代码:** ${{ env.VERSION_CODE }}
            - **分支:** ${{ github.ref_name }}
            - **提交ID:** ${{ github.sha }}
            - **短提交ID:** ${{ env.SHORT_SHA }}
            
            ### 变更内容
            ${{ github.event.head_commit.message }}
            
            ### 构建信息
            - **构建触发:** ${{ github.event_name }}
            - **构建时间:** ${{ github.event.repository.updated_at }}
            - **工作流:** ${{ github.workflow }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 恢复原文件（可选）
      - name: restore original file
        if: always()
        run: |
          if [ -f app/build.gradle.kts.bak ]; then
            mv app/build.gradle.kts.bak app/build.gradle.kts
            echo "已恢复原文件"
          fi
