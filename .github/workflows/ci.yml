name: ci

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job-common:
    runs-on: ubuntu-24.04
    outputs:
      SHORT_SHA: ${{ steps.expose_sha.outputs.short_sha }}
    steps:
      - name: expose short commit sha
        id: expose_sha
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

  build-android:
    needs: job-common
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHORT_SHA: ${{ needs.job-common.outputs.SHORT_SHA }}
      NEW_PACKAGE: "com.gudaoweb.app"
      OLD_PACKAGE: "org.michaelbel.myapplication"
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: cache gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('/*.gradle*', '/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: cache gradle wrapper
        uses: actions/cache@v3
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      # 修改包名并删除旧文件
      - name: modify package name and cleanup
        run: |
          echo "=== 修改 build.gradle.kts ==="
          # 修改 build.gradle.kts
          sed -i 's/namespace\s*=\s*"[^"]*"/namespace = "'"$NEW_PACKAGE"'"/' app/build.gradle.kts
          sed -i 's/applicationId\s*=\s*"[^"]*"/applicationId = "'"$NEW_PACKAGE"'"/' app/build.gradle.kts
          sed -i 's/archivesName\.set\s*(\s*"[^"]*"/archivesName.set("GudaoWeb-v${android.defaultConfig.versionName}(${android.defaultConfig.versionCode})"/' app/build.gradle.kts
          
          echo "=== 删除旧包名的文件 ==="
          # 删除旧包名的所有文件（关键步骤！）
          if [ -d "app/src/main/kotlin/org" ]; then
            rm -rf app/src/main/kotlin/org
            echo "已删除旧包名目录: app/src/main/kotlin/org"
          fi
          
          # 确保新包名目录存在
          mkdir -p app/src/main/kotlin/com/gudaoweb/app
          
          echo "=== 修改 Kotlin 文件中的包声明 ==="
          # 修改所有 Kotlin 文件中的包声明
          find app/src/main/kotlin -name "*.kt" -type f -exec sed -i 's/package org\.michaelbel\.myapplication/package com.gudaoweb.app/g' {} +
          
          echo "=== 修改导入语句中的 R 文件 ==="
          # 修改 R 文件导入
          find app/src/main/kotlin -name "*.kt" -type f -exec sed -i 's/import org\.michaelbel\.myapplication\.R/import com.gudaoweb.app.R/g' {} +
          find app/src/main/kotlin -name "*.kt" -type f -exec sed -i 's/org\.michaelbel\.myapplication\.R/com.gudaoweb.app.R/g' {} +
          
          # 修改 AndroidManifest.xml
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/package="[^"]*"/package="'"$NEW_PACKAGE"'"/' app/src/main/AndroidManifest.xml
          fi
          
          echo "=== 文件结构 ==="
          find app/src/main/kotlin -type f -name "*.kt" | head -10
          echo ""
          echo "=== 验证包声明 ==="
          grep -r "package" app/src/main/kotlin/ --include="*.kt" | head -5

      - name: clean outputs directory
        run: rm -rf app/build/outputs/*

      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: assemble debug artifact
        run: ./gradlew assembleDebug

      - name: upload artifacts to outputs
        uses: actions/upload-artifact@v4
        with:
          name: GudaoWeb-${{ env.SHORT_SHA }}
          path: |
            app/build/outputs/apk

      - name: expose version
        id: version
        run: ./gradlew -q printVersion | tee -a $GITHUB_ENV | tee -a $GITHUB_OUTPUT

      - name: expose apk path
        run: |
          echo "APK_PATH=$(find app/build/outputs/apk -name '*.apk' -type f -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: create pre-release
        uses: softprops/action-gh-release@v1
        with:
          name: GudaoWeb Pre-release ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }}) - ${{ env.SHORT_SHA }}
          tag_name: pre-${{ env.SHORT_SHA }}
          prerelease: true
          files: ${{ env.APK_PATH }}
          body: |
            ## 孤岛网页 预发布版本
            
            - **包名:** ${{ env.NEW_PACKAGE }}
            - **版本名称:** ${{ env.VERSION_NAME }}
            - **版本代码:** ${{ env.VERSION_CODE }}
            - **提交ID:** ${{ env.SHORT_SHA }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
