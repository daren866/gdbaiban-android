name: ci

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job-common:
    runs-on: ubuntu-24.04
    outputs:
      SHORT_SHA: ${{ steps.expose_sha.outputs.short_sha }}
    steps:
      - name: expose short commit sha
        id: expose_sha
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

  build-android:
    needs: job-common
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHORT_SHA: ${{ needs.job-common.outputs.SHORT_SHA }}
      OLD_PACKAGE: "org.michaelbel.myapplication"
      NEW_PACKAGE: "com.gudaoweb.app"
      OLD_PATH: "org/michaelbel/myapplication"
      NEW_PATH: "com/gudaoweb/app"
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: cache gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('/*.gradle*', '/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: cache gradle wrapper
        uses: actions/cache@v3
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      # 完整修改包名和相关引用
      - name: modify package name and references
        run: |
          echo "=== 修改前 ==="
          echo "Build.gradle中的包名："
          grep -n "namespace\|applicationId" app/build.gradle.kts || echo "未找到"
          
          # 1. 修改 build.gradle.kts
          sed -i 's/namespace\s*=\s*"[^"]*"/namespace = "'"$NEW_PACKAGE"'"/' app/build.gradle.kts
          sed -i 's/applicationId\s*=\s*"[^"]*"/applicationId = "'"$NEW_PACKAGE"'"/' app/build.gradle.kts
          sed -i 's/archivesName\.set\s*(\s*"[^"]*"/archivesName.set("GudaoWeb-v${android.defaultConfig.versionName}(${android.defaultConfig.versionCode})"/' app/build.gradle.kts
          
          echo "=== 修改 build.gradle.kts 后 ==="
          grep -n "namespace\|applicationId" app/build.gradle.kts
          
          # 2. 创建新的包目录结构
          mkdir -p app/src/main/kotlin/${{ env.NEW_PATH }}
          
          # 3. 移动所有 Kotlin 文件到新包目录
          if [ -d "app/src/main/kotlin/${{ env.OLD_PATH }}" ]; then
            cp -r app/src/main/kotlin/${{ env.OLD_PATH }}/* app/src/main/kotlin/${{ env.NEW_PATH }}/
            echo "已复制文件到新目录"
          fi
          
          # 4. 修改所有 Kotlin 文件中的包声明和导入
          find app/src/main/kotlin -name "*.kt" -type f -exec sed -i 's/package ${{ env.OLD_PACKAGE }}/package ${{ env.NEW_PACKAGE }}/g' {} +
          find app/src/main/kotlin -name "*.kt" -type f -exec sed -i 's/import ${{ env.OLD_PACKAGE }}/import ${{ env.NEW_PACKAGE }}/g' {} +
          
          # 5. 修改资源文件中的包名引用（R 文件）
          find app/src/main -name "*.kt" -type f -exec sed -i 's/import ${{ env.OLD_PACKAGE }}\.R/import ${{ env.NEW_PACKAGE }}\.R/g' {} +
          find app/src/main -name "*.kt" -type f -exec sed -i 's/${{ env.OLD_PACKAGE }}\.R/${{ env.NEW_PACKAGE }}\.R/g' {} +
          
          # 6. 修改 AndroidManifest.xml 中的包名
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/package="[^"]*"/package="'"$NEW_PACKAGE"'"/' app/src/main/AndroidManifest.xml
          fi
          
          # 7. 修改资源文件中的布局引用
          find app/src/main/res/layout -name "*.xml" -type f -exec sed -i 's/${{ env.OLD_PACKAGE }}/${{ env.NEW_PACKAGE }}/g' {} + 2>/dev/null || true
          
          echo "=== 修改完成 ==="
          echo "新包名: $NEW_PACKAGE"
          echo "查看修改后的 Kotlin 文件："
          find app/src/main/kotlin -name "*.kt" -type f | head -5
          head -5 app/src/main/kotlin/${{ env.NEW_PATH }}/MainActivity.kt 2>/dev/null || echo "MainActivity.kt 不存在"

      # 可选：验证修改
      - name: verify changes
        run: |
          echo "验证包声明："
          grep -r "package $NEW_PACKAGE" app/src/main/kotlin/ --include="*.kt" | head -5
          echo ""
          echo "验证 R 引用："
          grep -r "import $NEW_PACKAGE.R" app/src/main/kotlin/ --include="*.kt" | head -5

      - name: clean outputs directory
        run: rm -rf app/build/outputs/*

      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: assemble debug artifact
        run: ./gradlew assembleDebug

      - name: upload artifacts to outputs
        uses: actions/upload-artifact@v4
        with:
          name: GudaoWeb-${{ env.SHORT_SHA }}
          path: |
            app/build/outputs/apk

      - name: expose version
        id: version
        run: ./gradlew -q printVersion | tee -a $GITHUB_ENV | tee -a $GITHUB_OUTPUT

      - name: expose apk path
        run: |
          echo "APK_PATH=$(find app/build/outputs/apk -name '*.apk' -type f -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: create pre-release
        uses: softprops/action-gh-release@v1
        with:
          name: GudaoWeb Pre-release ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }}) - ${{ env.SHORT_SHA }}
          tag_name: pre-${{ env.SHORT_SHA }}
          prerelease: true
          files: ${{ env.APK_PATH }}
          body: |
            ## 孤岛网页 预发布版本
            
            - **包名:** ${{ env.NEW_PACKAGE }}
            - **版本名称:** ${{ env.VERSION_NAME }}
            - **版本代码:** ${{ env.VERSION_CODE }}
            - **提交ID:** ${{ env.SHORT_SHA }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
