name: ci

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job-common:
    runs-on: ubuntu-24.04
    outputs:
      SHORT_SHA: ${{ steps.expose_sha.outputs.short_sha }}
    steps:
      - name: expose short commit sha
        id: expose_sha
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "short_sha=$SHORT_SHA" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

  build-android:
    needs: job-common
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHORT_SHA: ${{ needs.job-common.outputs.SHORT_SHA }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: cache gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('/*.gradle*', '/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: cache gradle wrapper
        uses: actions/cache@v3
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: clean outputs directory
        run: rm -rf app/build/outputs/*

      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: assemble debug artifact
        run: ./gradlew assembleDebug

      - name: upload artifacts to outputs
        uses: actions/upload-artifact@v4
        with:
          path: |
            app/build/outputs/apk

      - name: expose version
        id: version
        run: ./gradlew -q printVersion | tee -a $GITHUB_ENV | tee -a $GITHUB_OUTPUT

      - name: expose apk path
        run: |
          echo "APK_PATH=$(find app/build/outputs/apk -name '*.apk' -type f -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: create pre-release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Pre-release ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }}) - ${{ env.SHORT_SHA }}
          tag_name: pre-${{ env.SHORT_SHA }}
          prerelease: true
          files: ${{ env.APK_PATH }}
          body: |
            ## 预发布版本
            
            - **版本名称:** ${{ env.VERSION_NAME }}
            - **版本代码:** ${{ env.VERSION_CODE }}
            - **分支:** ${{ github.ref_name }}
            - **提交ID:** ${{ github.sha }}
            - **短提交ID:** ${{ env.SHORT_SHA }}
            
            ### 变更内容
            ${{ github.event.head_commit.message }}
            
            ### 构建信息
            - **构建触发:** ${{ github.event_name }}
            - **构建时间:** ${{ github.event.repository.updated_at }}
            - **工作流:** ${{ github.workflow }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
