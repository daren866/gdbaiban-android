name: Change Package Name

on:
  workflow_dispatch:  # 手动触发
    inputs:
      new_package_name:
        description: '新包名 (例如: com.gudaoweb.app)'
        required: true
        default: 'com.gudaoweb.app'
      commit_message:
        description: '提交信息'
        required: true
        default: 'Change package name to com.gudaoweb.app'

jobs:
  change-package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # 允许推送到仓库
    env:
      OLD_PACKAGE: "org.michaelbel.myapplication"
      OLD_PATH: "org/michaelbel/myapplication"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 关键步骤：清理所有 Gradle 缓存
      - name: Clear all caches
        run: |
          echo "=== 清理 Gradle 缓存 ==="
          # 删除所有 Gradle 缓存目录
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf .gradle/
          
          # 删除所有构建输出
          rm -rf app/build/
          rm -rf build/
          
          echo "缓存已清理"
          
          # 查看磁盘空间
          df -h

      - name: Set new package variables
        run: |
          NEW_PACKAGE="${{ github.event.inputs.new_package_name }}"
          echo "NEW_PACKAGE=$NEW_PACKAGE" >> $GITHUB_ENV
          
          # 转换包名为路径格式 (例如: com.gudaoweb.app -> com/gudaoweb/app)
          NEW_PATH=$(echo $NEW_PACKAGE | tr '.' '/')
          echo "NEW_PATH=$NEW_PATH" >> $GITHUB_ENV
          
          echo "旧包名: ${{ env.OLD_PACKAGE }}"
          echo "新包名: $NEW_PACKAGE"
          echo "旧路径: ${{ env.OLD_PATH }}"
          echo "新路径: $NEW_PATH"

      - name: Create new directory structure
        run: |
          # 创建新包名的目录结构
          mkdir -p app/src/main/kotlin/${{ env.NEW_PATH }}
          echo "创建新目录: app/src/main/kotlin/${{ env.NEW_PATH }}"

      - name: Copy Kotlin files to new package
        run: |
          # 检查旧目录是否存在
          if [ -d "app/src/main/kotlin/${{ env.OLD_PATH }}" ]; then
            # 复制所有 Kotlin 文件到新目录
            cp -r app/src/main/kotlin/${{ env.OLD_PATH }}/* app/src/main/kotlin/${{ env.NEW_PATH }}/
            echo "已复制文件到新目录"
            
            # 显示复制的文件
            echo "复制的文件:"
            ls -la app/src/main/kotlin/${{ env.NEW_PATH }}/
          else
            echo "错误: 旧目录不存在!"
            exit 1
          fi

      - name: Update package declarations in Kotlin files
        run: |
          # 修改所有 Kotlin 文件中的 package 声明
          find app/src/main/kotlin/${{ env.NEW_PATH }} -name "*.kt" -type f | while read file; do
            echo "处理文件: $file"
            # 将 package org.michaelbel.myapplication 替换为新包名
            sed -i "s/package ${{ env.OLD_PACKAGE }}/package ${{ env.NEW_PACKAGE }}/g" "$file"
          done
          
          echo "已更新 package 声明"

      - name: Update all imports and references
        run: |
          echo "=== 更新所有导入和引用 ==="
          
          # 更新所有 Kotlin 文件中的导入语句
          find app/src/main/kotlin -name "*.kt" -type f | while read file; do
            echo "处理文件: $file"
            
            # 更新 import 语句中的旧包名
            sed -i "s/import ${{ env.OLD_PACKAGE }}\./import ${{ env.NEW_PACKAGE }}\./g" "$file"
            
            # 更新 R 文件导入
            sed -i "s/import ${{ env.OLD_PACKAGE }}\.R/import ${{ env.NEW_PACKAGE }}\.R/g" "$file"
            
            # 更新直接引用的 R 文件
            sed -i "s/${{ env.OLD_PACKAGE }}\.R/${{ env.NEW_PACKAGE }}\.R/g" "$file"
            
            # 更新所有以旧包名开头的引用（包括 michaelbel）
            sed -i "s/${{ env.OLD_PACKAGE }}\./${{ env.NEW_PACKAGE }}\./g" "$file"
            
            # 专门处理 michaelbel 的引用
            sed -i "s/org\.michaelbel\./com\.gudaoweb\./g" "$file"
          done
          
          echo "导入和引用更新完成"

      - name: Update build.gradle.kts
        run: |
          # 备份原文件
          cp app/build.gradle.kts app/build.gradle.kts.bak
          
          # 修改 namespace
          sed -i "s/namespace\s*=\s*\"${{ env.OLD_PACKAGE }}\"/namespace = \"${{ env.NEW_PACKAGE }}\"/" app/build.gradle.kts
          
          # 修改 applicationId
          sed -i "s/applicationId\s*=\s*\"${{ env.OLD_PACKAGE }}\"/applicationId = \"${{ env.NEW_PACKAGE }}\"/" app/build.gradle.kts
          
          # 修改 archivesName (输出文件名)
          APP_NAME=$(echo "${{ env.NEW_PACKAGE }}" | cut -d'.' -f2)
          sed -i "s/archivesName\.set\s*(\s*\"[^\"]*\"/archivesName.set(\"${APP_NAME^}-v\${android.defaultConfig.versionName}(\${android.defaultConfig.versionCode})\"/" app/build.gradle.kts
          
          echo "已更新 build.gradle.kts"
          echo "修改后的配置:"
          grep -A 2 "namespace\|applicationId" app/build.gradle.kts

      - name: Update AndroidManifest.xml
        run: |
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            # 修改 manifest 中的 package
            sed -i "s/package=\"${{ env.OLD_PACKAGE }}\"/package=\"${{ env.NEW_PACKAGE }}\"/" app/src/main/AndroidManifest.xml
            
            # 更新 manifest 中的其他引用
            sed -i "s/${{ env.OLD_PACKAGE }}/${{ env.NEW_PACKAGE }}/g" app/src/main/AndroidManifest.xml
            
            echo "已更新 AndroidManifest.xml"
          fi

      - name: Update resource references in XML files
        run: |
          # 更新布局文件中的包名引用
          find app/src/main/res -name "*.xml" -type f | while read file; do
            sed -i "s/${{ env.OLD_PACKAGE }}/${{ env.NEW_PACKAGE }}/g" "$file" 2>/dev/null || true
            # 专门处理 michaelbel
            sed -i "s/org\.michaelbel\./com\.gudaoweb\./g" "$file" 2>/dev/null || true
          done
          echo "已更新 XML 资源文件"

      - name: Remove old package directory
        run: |
          # 删除旧包名目录
          if [ -d "app/src/main/kotlin/${{ env.OLD_PATH }}" ]; then
            rm -rf app/src/main/kotlin/${{ env.OLD_PATH }}
            echo "已删除旧目录: app/src/main/kotlin/${{ env.OLD_PATH }}"
          fi

      - name: Verify changes
        run: |
          echo "=== 验证修改后的文件 ==="
          echo ""
          echo "新目录结构:"
          find app/src/main/kotlin/${{ env.NEW_PATH }} -type f -name "*.kt" | head -10
          echo ""
          echo "检查 package 声明:"
          grep -r "package ${{ env.NEW_PACKAGE }}" app/src/main/kotlin/${{ env.NEW_PATH }} --include="*.kt" | head -5
          echo ""
          echo "检查导入语句:"
          grep -r "^import" app/src/main/kotlin/${{ env.NEW_PATH }} --include="*.kt" | head -10
          echo ""
          echo "检查是否有残留的旧包名:"
          grep -r "org\.michaelbel" app/src/main/kotlin/ --include="*.kt" || echo "没有发现旧包名"
          echo ""
          echo "检查 build.gradle.kts:"
          grep -A 2 "namespace\|applicationId" app/build.gradle.kts

      # 再次清理构建目录，确保干净构建
      - name: Clean build directory again
        run: |
          echo "=== 再次清理构建目录 ==="
          rm -rf app/build/
          rm -rf build/
          echo "构建目录已清理"

      - name: Build APK to verify (clean build)
        run: |
          echo "=== 开始全新构建 APK ==="
          chmod +x ./gradlew
          
          # 使用 --no-build-cache 和 --refresh-dependencies 确保不使用缓存
          ./gradlew clean assembleDebug --no-build-cache --refresh-dependencies --stacktrace
          
          echo "=== 构建完成 ==="
          
          # 显示生成的 APK 信息
          echo "生成的 APK 文件:"
          find app/build/outputs -name "*.apk" -type f -ls
          
          # 显示 APK 的详细信息
          APK_PATH=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "APK 路径: $APK_PATH"
            ls -la "$APK_PATH"
            file "$APK_PATH"
          else
            echo "错误: 没有生成 APK 文件!"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          # 配置 git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 添加所有修改的文件
          git add app/
          
          # 检查是否有修改
          if git diff --staged --quiet; then
            echo "没有文件被修改"
          else
            # 提交修改
            git commit -m "${{ github.event.inputs.commit_message }}"
            
            # 推送到仓库
            git push origin HEAD:${{ github.ref }}
            
            echo "已推送修改到仓库"
            git show --stat
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-with-new-package-${{ github.run_id }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
